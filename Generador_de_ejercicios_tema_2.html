<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cálculo Integral · Sumas de Riemann Finitas</title>
<script>
  window.MathJax = {
    tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$']] },
    svg: { fontCache: 'global' },
    options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#111827;--muted:#6b7280;--brand:#4f46e5;--brand2:#7c3aed;
        --ok:#059669;--okbg:#ecfdf5;--err:#dc2626;--errbg:#fef2f2;--line:#e5e7eb;--warn:#b45309;--warnbg:#fffbeb}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh}
  header{background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;padding:26px 20px 30px}
  .wrap{max-width:900px;margin:0 auto}
  header h1{margin:0 0 6px;font-size:1.35rem;letter-spacing:-.01em}
  header p{margin:0;opacity:.92;font-size:.92rem}
  main{max-width:900px;margin:-20px auto 60px;padding:0 20px}
  .card{background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(17,24,39,.08);
        padding:24px;border:1px solid var(--line)}
  .barra{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:flex-end;margin-bottom:18px}
  input[type="text"]{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;
       background:#fff;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
  input[type="text"]:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.14)}
  #enunciado{font-size:1.03rem;background:#fafafe;border:1px solid var(--line);
       border-left:4px solid var(--brand);border-radius:12px;padding:16px 18px;margin-bottom:18px}
  .fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  #respuesta{flex:1 1 240px;min-width:180px}
  button{font:inherit;font-weight:650;border:none;border-radius:10px;padding:10px 16px;cursor:pointer;
         transition:transform .06s,filter .15s,background .15s}
  button:active{transform:translateY(1px)}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-ghost{background:#eef2ff;color:var(--brand)}
  .btn-ghost:hover{background:#e0e7ff}
  .btn-soft{background:#f3f4f6;color:#374151}
  .btn-soft:hover{background:#e5e7eb}
  .feedback{margin-top:16px;padding:14px 16px;border-radius:12px;font-weight:600;display:none}
  .feedback.ok{display:block;background:var(--okbg);color:var(--ok);border:1px solid #a7f3d0}
  .feedback.err{display:block;background:var(--errbg);color:var(--err);border:1px solid #fecaca}
  .feedback code{background:#fff;border:1px solid #d1fae5;border-radius:4px;padding:1px 6px;font-size:.9em}
  .panel{margin-top:14px;padding:14px 16px;border-radius:12px;font-size:.95rem;display:none}
  .panel.pista{background:var(--warnbg);border:1px solid #fde68a;color:#7c2d12}
  .panel.explicacion{background:#f5f3ff;border:1px solid #ddd6fe;color:#3730a3}
  .panel.visible{display:block}
  .panel h3{margin:0 0 6px;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
  .marcador{display:flex;gap:18px;margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);
       font-size:.85rem;color:var(--muted);font-weight:600}
  .marcador b{color:var(--ink)}
  footer{max-width:900px;margin:0 auto 40px;padding:0 20px;color:var(--muted);font-size:.8rem;text-align:center}
  .kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f3f4f6;border:1px solid var(--line);
       border-radius:6px;padding:1px 6px;font-size:.78rem}
  @media(max-width:560px){.card{padding:18px}#enunciado{font-size:.98rem}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Generador infinito de ejercicios</h1>
    <p><b>Materia:</b> Cálculo Integral &nbsp;·&nbsp; <b>Tema:</b> Sumas de Riemann Finitas</p>
  </div>
</header>
<main>
  <div class="card">
    <div class="barra"><button id="btnNuevo" class="btn-ghost">Nuevo ejercicio</button></div>
    <div id="enunciado"></div>
    <div class="fila">
      <input id="respuesta" type="text" autocomplete="off" spellcheck="false"
             placeholder="Escribe tu respuesta usando ^ para potencias y / para fracciones…">
      <button id="btnVerificar" class="btn-primary">Verificar</button>
      <button id="btnPista" class="btn-soft">Pista</button>
      <button id="btnExplicacion" class="btn-soft">Explicación</button>
    </div>
    <div id="feedback" class="feedback"></div>
    <div id="pistaBox" class="panel pista"></div>
    <div id="explicacionBox" class="panel explicacion"></div>
    <div class="marcador">
      <span>Aciertos: <b id="mArc">0</b></span>
      <span>Intentos: <b id="mInt">0</b></span>
      <span style="margin-left:auto">Enter = verificar · <span class="kbd">N</span> = nuevo</span>
    </div>
  </div>
</main>
<footer>Generador aleatorio educativo · Cálculo Integral · Sumas de Riemann Finitas</footer>

<script>
/* ==================== UTILIDADES ==================== */
function escaparHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function normalizar(valor){
  var t=(valor===null||valor===undefined)?'':String(valor);
  t=t.toLowerCase().trim();
  t=t.replace(/\$/g,'');
  t=t.replace(/\\(left|right|big|Big|bigg|Bigg)/g,'');
  t=t.replace(/\\[,;:!]/g,'');
  t=t.replace(/\\(quad|qquad)/g,'');
  t=t.replace(/\\dfrac/g,'\\frac');
  t=t.replace(/\\(cdot|times|ast)/g,'*');
  t=t.replace(/\\div/g,'/');
  t=t.replace(/²/g,'^2').replace(/³/g,'^3').replace(/⁴/g,'^4');
  t=t.replace(/\s+/g,'');
  t=t.replace(/·/g,'*');
  var previo;
  do{previo=t;t=t.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,'(($1)/($2))');}while(t!==previo);
  t=t.replace(/[{}]/g,'');
  t=t.replace(/\\/g,'');
  do{previo=t;t=t.replace(/\^\(([^()]*)\)/g,'^$1');}while(t!==previo);
  t=t.replace(/\*\*/g,'^');
  return t;
}
function sinParentesis(s){return String(s).replace(/[()]/g,'');}
function coincideTexto(entrada,acepta){
  var u=normalizar(entrada);
  if(!u)return false;
  var uSin=sinParentesis(u);
  for(var i=0;i<acepta.length;i++){
    var a=normalizar(acepta[i]);
    if(u===a)return true;
    if(uSin===sinParentesis(a))return true;
  }
  return false;
}
function aNumero(entrada){
  var s=String(entrada).replace(/\s/g,'').replace(/\$/g,'').replace(/\{/g,'').replace(/\}/g,'').replace(',','.');
  if(s==='')return NaN;
  var m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(m){var d=parseFloat(m[2]);if(d===0)return NaN;return parseFloat(m[1])/d;}
  var n=Number(s);return isNaN(n)?NaN:n;
}

/* ==================== GENERADOR: Sumas de Riemann Finitas ==================== */
function genRiemannFinitas(){
  var t=Math.floor(Math.random()*5);

  if(t===0){
    var n0=2+Math.floor(Math.random()*4);
    var suma0=n0*(n0+1)*(2*n0+1)/6;
    return{
      tipo:'numerica',
      problema:'Una cooperativa de mujeres tejedoras de la sierra registra que en la semana $x$ produce '+
        '$f(x)=x^{2}$ decenas de piezas. Para estimar la producción total de las primeras $'+n0+'$ semanas '+
        'se usa una suma de Riemann derecha con subintervalos de ancho $\\Delta x=1$: '+
        '$R_{'+n0+'}=\\sum_{k=1}^{'+n0+'} f(k)\\,\\Delta x$. ¿Cuál es el valor de $R_{'+n0+'}$?',
      solucion:'$R_{'+n0+'} = '+suma0+'$',
      respuestaLaTeX:String(suma0),
      acepta:[String(suma0)],
      respuesta:suma0,tolerancia:0.0001,
      pista:'Con $\\Delta x=1$ los extremos derechos son $x_k=k$, así que '+
        '$R_{'+n0+'}=\\sum_{k=1}^{'+n0+'}k^{2}$. '+
        'Recuerda la fórmula $\\sum_{k=1}^{n}k^{2}=\\frac{n(n+1)(2n+1)}{6}$.',
      explicacion:'Paso 1. $\\Delta x=\\frac{'+n0+'-0}{'+n0+'}=1$. '+
        'Paso 2. Los extremos derechos son $x_k = 0 + k\\cdot 1 = k$, para $k=1,\\dots,'+n0+'$. '+
        'Paso 3. $R_{'+n0+'}=\\sum_{k=1}^{'+n0+'}k^{2}\\cdot 1 '+
        '= \\frac{'+n0+'('+n0+'+1)(2\\cdot '+n0+'+1)}{6} = '+suma0+'$.'
    };
  }

  if(t===1){
    var m1=1+Math.floor(Math.random()*4);
    var b1=1+Math.floor(Math.random()*5);
    var n1=2+Math.floor(Math.random()*4);
    var L1=m1*(n1-1)*n1/2+b1*n1;
    return{
      tipo:'numerica',
      problema:'Una ingeniera en innovación digital mide el consumo de un servidor comunitario: '+
        'en la hora $x$ consume $f(x)='+m1+'x+'+b1+'$ kWh. Estima la energía acumulada durante las '+
        'primeras $'+n1+'$ horas usando una suma de Riemann izquierda con $\\Delta x=1$: '+
        '$L_{'+n1+'}=\\sum_{k=0}^{'+(n1-1)+'} f(k)\\,\\Delta x$. ¿Cuánto vale $L_{'+n1+'}$?',
      solucion:'$L_{'+n1+'} = '+L1+'$ kWh',
      respuestaLaTeX:String(L1),
      acepta:[String(L1)],
      respuesta:L1,tolerancia:0.0001,
      pista:'En la suma izquierda se evalúa en $x=0,1,2,\\dots,'+(n1-1)+'$. '+
        'Separa la suma en dos partes: $'+m1+'\\sum_{k=0}^{'+(n1-1)+'}k + '+b1+'\\cdot '+n1+'$ '+
        'y usa $\\sum_{k=1}^{N}k=\\frac{N(N+1)}{2}$.',
      explicacion:'Paso 1. $\\Delta x=1$ y los puntos izquierdos son $x_k=k$ con $k=0,\\dots,'+(n1-1)+'$. '+
        'Paso 2. $L_{'+n1+'}=\\sum_{k=0}^{'+(n1-1)+'}('+m1+'k+'+b1+') '+
        '= '+m1+'\\cdot\\frac{'+(n1-1)+'\\cdot'+n1+'}{2} + '+b1+'\\cdot'+n1+'$. '+
        'Paso 3. $L_{'+n1+'} = '+(m1*(n1-1)*n1/2)+' + '+(b1*n1)+' = '+L1+'$ kWh.'
    };
  }

  if(t===2){
    var m2=2*(1+Math.floor(Math.random()*3));
    var b2=1+Math.floor(Math.random()*5);
    var n2=2+Math.floor(Math.random()*4);
    var M2=m2*n2*n2/2+b2*n2;
    return{
      tipo:'numerica',
      problema:'Una bióloga marina monitorea el crecimiento de un cultivo de algas: la biomasa (en kg) crece según '+
        '$f(x)='+m2+'x+'+b2+'$. Estima la biomasa total en las primeras $'+n2+'$ horas con una '+
        'suma de Riemann por punto medio de ancho $\\Delta x=1$: '+
        '$M_{'+n2+'}=\\sum_{k=1}^{'+n2+'} f\\!\\left(k-\\tfrac{1}{2}\\right)\\Delta x$. '+
        '¿Cuánto vale $M_{'+n2+'}$?',
      solucion:'$M_{'+n2+'} = '+M2+'$ kg',
      respuestaLaTeX:String(M2),
      acepta:[String(M2)],
      respuesta:M2,tolerancia:0.0001,
      pista:'Los puntos medios son $x_k = 0.5,\\ 1.5,\\ 2.5,\\dots$ (es decir $k-\\tfrac{1}{2}$). '+
        'Para una recta, la suma por punto medio coincide con el área exacta: '+
        '$'+m2+'\\cdot\\frac{'+n2+'^{2}}{2} + '+b2+'\\cdot '+n2+'$.',
      explicacion:'Paso 1. $\\Delta x=1$ y los puntos medios son $x_k = k-\\tfrac{1}{2}$ para $k=1,\\dots,'+n2+'$. '+
        'Paso 2. $\\sum_{k=1}^{'+n2+'}\\left(k-\\tfrac{1}{2}\\right) '+
        '= \\frac{'+n2+'('+n2+'+1)}{2} - \\frac{'+n2+'}{2} = \\frac{'+n2+'^{2}}{2} = '+(n2*n2/2)+'$. '+
        'Paso 3. $M_{'+n2+'} = '+m2+'\\cdot '+(n2*n2/2)+' + '+b2+'\\cdot '+n2+
        ' = '+(m2*n2*n2/2)+' + '+(b2*n2)+' = '+M2+'$ kg.'
    };
  }

  if(t===3){
    return{
      tipo:'simbolica',
      problema:'La suma de Riemann derecha de $f(x)=x$ en el intervalo $[0,b]$ con $n$ subintervalos iguales es '+
        '$R_n=\\frac{b^{2}(n+1)}{2n}$. '+
        'Escribe el valor exacto del área bajo la curva cuando $n\\to\\infty$, en función de $b$.',
      solucion:'$\\displaystyle\\lim_{n\\to\\infty}\\frac{b^{2}(n+1)}{2n}=\\frac{b^{2}}{2}$',
      respuestaLaTeX:'\\frac{b^{2}}{2}',
      acepta:['b^2/2','b^{2}/2','\\frac{b^2}{2}','\\frac{b^{2}}{2}','(b^2)/2','0.5b^2',
              '\\frac{1}{2}b^{2}','(1/2)b^2','1/2b^2'],
      pista:'Divide numerador y denominador entre $n$: '+
        '$\\frac{b^{2}(n+1)}{2n}=\\frac{b^{2}}{2}\\cdot\\frac{n+1}{n}$. '+
        '¿A qué tiende $\\frac{n+1}{n}$ cuando $n\\to\\infty$?',
      explicacion:'Paso 1. Reescribe: $\\frac{b^{2}(n+1)}{2n}=\\frac{b^{2}}{2}\\cdot\\left(1+\\frac{1}{n}\\right)$. '+
        'Paso 2. Cuando $n\\to\\infty$, el término $\\frac{1}{n}\\to 0$. '+
        'Paso 3. Por lo tanto $\\lim_{n\\to\\infty}R_n=\\frac{b^{2}}{2}\\cdot 1=\\frac{b^{2}}{2}$, '+
        'que coincide con $\\int_{0}^{b}x\\,dx=\\frac{b^{2}}{2}$.'
    };
  }

  var n4=2+Math.floor(Math.random()*3);
  var S4=Math.pow(n4*(n4+1)/2,2);
  return{
    tipo:'numerica',
    problema:'En un proyecto de innovación digital, el caudal de datos procesados por una red comunitaria sigue '+
      '$f(x)=x^{3}$ GB por hora. Estima los GB acumulados durante las primeras $'+n4+'$ horas con una '+
      'suma de Riemann derecha de ancho $\\Delta x=1$: '+
      '$R_{'+n4+'}=\\sum_{k=1}^{'+n4+'}f(k)\\,\\Delta x$. ¿Cuánto vale $R_{'+n4+'}$?',
    solucion:'$R_{'+n4+'} = '+S4+'$ GB',
    respuestaLaTeX:String(S4),
    acepta:[String(S4)],
    respuesta:S4,tolerancia:0.0001,
    pista:'Necesitas $\\sum_{k=1}^{'+n4+'}k^{3}$ y la identidad '+
      '$\\sum_{k=1}^{n}k^{3}=\\left(\\frac{n(n+1)}{2}\\right)^{2}$.',
    explicacion:'Paso 1. $\\Delta x=1$ y los extremos derechos son $x_k=k$, con $k=1,\\dots,'+n4+'$. '+
      'Paso 2. $R_{'+n4+'}=\\sum_{k=1}^{'+n4+'}k^{3}\\cdot 1 '+
      '= \\left(\\frac{'+n4+'('+n4+'+1)}{2}\\right)^{2} '+
      '= \\left(\\frac{'+n4+'\\cdot'+(n4+1)+'}{2}\\right)^{2} '+
      '= '+(n4*(n4+1)/2)+'^{2} = '+S4+'$.'
  };
}

/* ==================== UI ==================== */
var ejercicioActual=null,aciertos=0,intentos=0;
var elEnunciado=document.getElementById('enunciado');
var elRespuesta=document.getElementById('respuesta');
var elFeedback=document.getElementById('feedback');
var elPista=document.getElementById('pistaBox');
var elExplicacion=document.getElementById('explicacionBox');

function tiposet(nodo,intento){
  intento=intento||0;
  if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetPromise([nodo]).catch(function(){});return;}
  if(intento<40)setTimeout(function(){tiposet(nodo,intento+1);},200);
}

function nuevoEjercicio(){
  ejercicioActual=genRiemannFinitas();
  elEnunciado.innerHTML=ejercicioActual.problema;
  elRespuesta.value='';
  elFeedback.className='feedback';elFeedback.innerHTML='';
  elPista.className='panel pista';elPista.innerHTML='';
  elExplicacion.className='panel explicacion';elExplicacion.innerHTML='';
  tiposet(elEnunciado);
  elRespuesta.focus();
}

function verificar(){
  if(!ejercicioActual)return;
  var entrada=elRespuesta.value;
  if(String(entrada).trim()===''){
    elFeedback.className='feedback err';elFeedback.innerHTML='Escribe una respuesta antes de verificar.';
    return;
  }
  var correcto=false;
  if(ejercicioActual.tipo==='numerica'){
    var num=aNumero(entrada);
    var tol=(ejercicioActual.tolerancia!=null)?ejercicioActual.tolerancia:0.0001;
    if(!isNaN(num)&&Math.abs(num-ejercicioActual.respuesta)<=tol)correcto=true;
    if(!correcto)correcto=coincideTexto(entrada,ejercicioActual.acepta||[]);
  }else{
    correcto=coincideTexto(entrada,ejercicioActual.acepta||[]);
  }
  intentos++;document.getElementById('mInt').textContent=intentos;
  if(correcto){
    aciertos++;document.getElementById('mArc').textContent=aciertos;
    elFeedback.className='feedback ok';
    elFeedback.innerHTML=
      '<div style="font-size:1.05em">✓ ¡Correcto!</div>'+
      '<div style="margin-top:8px;font-size:.92em;font-weight:500">Escribiste: <code>'+escaparHTML(String(entrada))+'</code></div>'+
      '<div style="margin-top:6px;font-weight:500">En notación matemática: $'+ejercicioActual.respuestaLaTeX+'$</div>';
    tiposet(elFeedback);
    mostrarExplicacion();
  }else{
    elFeedback.className='feedback err';
    elFeedback.innerHTML='✗ Todavía no. Revisa tu procedimiento o pide una pista.';
  }
}

function mostrarPista(){
  if(!ejercicioActual)return;
  elPista.innerHTML='<h3>Pista</h3>'+ejercicioActual.pista;
  elPista.className='panel pista visible';
  tiposet(elPista);
}
function mostrarExplicacion(){
  if(!ejercicioActual)return;
  elExplicacion.innerHTML='<h3>Explicación paso a paso</h3>'+ejercicioActual.explicacion;
  elExplicacion.className='panel explicacion visible';
  tiposet(elExplicacion);
}

document.getElementById('btnNuevo').addEventListener('click',nuevoEjercicio);
document.getElementById('btnVerificar').addEventListener('click',verificar);
document.getElementById('btnPista').addEventListener('click',mostrarPista);
document.getElementById('btnExplicacion').addEventListener('click',mostrarExplicacion);
elRespuesta.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();verificar();}});
document.addEventListener('keydown',function(e){
  if(e.key==='n'||e.key==='N'){
    var a=document.activeElement;
    if(a&&a.tagName==='INPUT')return;
    nuevoEjercicio();
  }
});

nuevoEjercicio();
</script>
</body>
</html>
